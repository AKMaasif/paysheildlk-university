# What "clean" means here: real errors, unused code, import order, likely bugs, security, and hidden characters in source.
# Line length is not checked, and style opinions about comprehensions or exception handling are left out on purpose:
# the fail-safe code catches broad exceptions deliberately.
target-version = "py312"
extend-exclude = ["data"]

[lint]
select = ["E4", "E7", "E9", "F", "I", "B", "S", "PLE"]
ignore = [
  "B008", # FastAPI's Depends() and Query() in argument defaults are the framework's pattern
]

[lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S107", "S311", "S603", "S607", "S108", "B011", "B017", "B023", "B905", "E701", "E702", "E731", "F811", "PLE2502", "PLE2515"]
"evaluation/**" = ["S101", "S311", "E701", "E702", "E731", "E741", "B007"]  # compact report scripts
"qa/**" = ["S603", "S607", "S101", "E741", "B007"]
